name: Bump packages

on:
  workflow_dispatch:
  schedule:
    # daily at 09:17 UTC
    - cron: "17 9 * * *"

permissions:
  contents: read

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git user
        uses: Homebrew/actions/git-user-config@main

      - name: Bump packages
        uses: Homebrew/actions/bump-packages@main
        with:
          token: ${{ secrets.HOMEBREW_BUMP_TOKEN }}
          formulae: dsluo/tap/openshell
          casks: dsluo/tap/lprint
          fork: false
